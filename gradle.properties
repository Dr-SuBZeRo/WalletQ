# Conservative JVM arguments for low-memory development system (8GB RAM)
org.gradle.jvmargs=-Xms128m -Xmx1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Run compilation in-process within Gradle daemon to avoid OOM from multiple JVM processes
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
ksp.incremental=false
